name: CI

# Runs the same verification contract as local development: scripts/ci.sh.
# Unity batchmode checks need a machine with Unity installed, so they stay a local step:
#   UNITY_EXE=... bash scripts/ci.sh
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Verification contract (clean-room scan, build, unit tests, scenarios, --verify)
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: bash scripts/ci.sh
